[project]
name = "email-archive-explorer"
version = "0.1.0"
description = "Browse, search and mine old email archives (Outlook PST/OST, MBOX, EML/Maildir) locally in your web browser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keiran" }]
keywords = ["email", "pst", "outlook", "mbox", "eml", "maildir", "archive", "search", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: System :: Archiving",
]
dependencies = [
    "libpff-python>=20231122",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "striprtf>=0.0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx2>=2.16.0",
    "ruff>=0.6.0",
]

[project.scripts]
email-archive = "email_archive_explorer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_archive_explorer"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["scripts/ui_audit.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]
