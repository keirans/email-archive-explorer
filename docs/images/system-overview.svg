<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Email Archive Explorer — system overview</title>
  <desc id="desc">Browser UI talks to a FastAPI app; the archive manager, indexer and attachment catalog sit on top of a driver registry that reads PST, MBOX and EML archives read-only, with per-archive SQLite caches in .cache/.</desc>
  <style>
    svg { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
          --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --purple:#8250df; --red:#cf222e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --panel:#161b22; --line:#3d444d; --text:#e6edf3; --muted:#9198a1;
            --blue:#4493f8; --green:#3fb950; --amber:#d29922; --purple:#a371f7; --red:#f85149; }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .card { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .blue   { fill: var(--blue);   fill-opacity: .09; stroke: var(--blue);   stroke-width: 1.5; }
    .green  { fill: var(--green);  fill-opacity: .09; stroke: var(--green);  stroke-width: 1.5; }
    .amber  { fill: var(--amber);  fill-opacity: .10; stroke: var(--amber);  stroke-width: 1.5; }
    .purple { fill: var(--purple); fill-opacity: .09; stroke: var(--purple); stroke-width: 1.5; }
    .red    { fill: var(--red);    fill-opacity: .09; stroke: var(--red);    stroke-width: 1.5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); }
    .h  { font-size: 15px; font-weight: 700; }
    .b  { font-size: 14px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: var(--muted); }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .warn { fill: var(--red); }
    .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    .dash { stroke: var(--red); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .ah { fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="690" rx="14"/>

  <!-- Browser -->
  <rect class="zone" x="20" y="20" width="960" height="120" rx="10"/>
  <text x="36" y="44"><tspan class="h">Browser</tspan><tspan class="s" dx="8">zero-build HTML · CSS · JS served from static/</tspan></text>
  <rect class="blue" x="40" y="56" width="290" height="68" rx="8"/>
  <text class="b" x="56" y="84">Mail view</text>
  <text class="s" x="56" y="106">folder tree · message list · reader · thread</text>
  <rect class="blue" x="355" y="56" width="290" height="68" rx="8"/>
  <text class="b" x="371" y="84">Attachments view</text>
  <text class="s" x="371" y="106">discover lenses · facets · preview · origin</text>
  <rect class="blue" x="670" y="56" width="290" height="68" rx="8"/>
  <text class="b" x="686" y="84">Archive menu</text>
  <text class="s" x="686" y="106">switch · open by path · rescan data/</text>

  <path class="arr" d="M390 140 V176" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="400" y="163">REST / JSON</text>

  <!-- API + CLI -->
  <rect class="purple" x="20" y="180" width="740" height="92" rx="10"/>
  <text x="36" y="204"><tspan class="h">FastAPI app</tspan><tspan class="s" dx="8">api.py · each request pins the active archive</tspan></text>
  <text class="m" x="36" y="232">/api/folders   /api/messages   /api/search   /api/archive/info</text>
  <text class="m" x="36" y="254">/api/attachments   /api/archives (open · scan)   …/eml   …/zip</text>
  <rect class="purple" x="780" y="180" width="200" height="92" rx="10"/>
  <text class="h" x="796" y="204">CLI</text>
  <text class="s" x="796" y="228">serve · stats</text>
  <text class="s" x="796" y="248">index · export</text>
  <text class="m" x="796" y="264">cli.py</text>

  <path class="arr" d="M170 272 V310" marker-end="url(#a)"/>
  <path class="arr" d="M490 272 V310" marker-end="url(#a)"/>
  <path class="arr" d="M720 272 V310" marker-end="url(#a)"/>

  <!-- Services -->
  <rect class="green" x="20" y="312" width="300" height="104" rx="10"/>
  <text class="b" x="36" y="338">ArchiveManager</text>
  <text class="s" x="36" y="360">catalog.db of known archives</text>
  <text class="s" x="36" y="380">opens → build_index if stale</text>
  <text class="s" x="36" y="400">lock: switch without dropping requests</text>

  <path class="arr" d="M320 364 H338" marker-end="url(#a)"/>

  <rect class="green" x="340" y="312" width="300" height="104" rx="10"/>
  <text class="b" x="356" y="338">Indexer</text>
  <text class="s" x="356" y="360">build_index · cache validity</text>
  <text class="s" x="356" y="380">folders, messages, FTS5 search</text>
  <text class="s" x="356" y="400">threads · analytics</text>

  <rect class="green" x="660" y="312" width="320" height="104" rx="10"/>
  <text class="b" x="676" y="338">Attachment catalog</text>
  <text class="s" x="676" y="360">category · duplicates · noise</text>
  <text class="s" x="676" y="380">summary · origin message · copies</text>
  <text class="s" x="676" y="400">peek inside ZIP / TAR</text>

  <path class="arr" d="M170 416 V454" marker-end="url(#a)"/>
  <path class="arr" d="M490 416 V454" marker-end="url(#a)"/>
  <path class="arr" d="M600 416 V436 H800 V454" marker-end="url(#a)"/>
  <path class="arr" d="M900 416 V454" marker-end="url(#a)"/>
  <text class="s" x="660" y="431">writes</text>

  <!-- Drivers -->
  <rect class="amber" x="20" y="456" width="700" height="120" rx="10"/>
  <text x="36" y="480"><tspan class="h">Driver registry</tspan><tspan class="s" dx="8">probe magic bytes, then extension</tspan></text>
  <rect class="card" x="40" y="494" width="205" height="66" rx="8"/>
  <text class="b" x="56" y="520">PstDriver</text>
  <text class="s" x="56" y="542">.pst .ost · libpff</text>
  <rect class="card" x="265" y="494" width="205" height="66" rx="8"/>
  <text class="b" x="281" y="520">MboxDriver</text>
  <text class="s" x="281" y="542">.mbox · From_ envelope</text>
  <rect class="card" x="490" y="494" width="210" height="66" rx="8"/>
  <text class="b" x="506" y="520">EmlDirDriver</text>
  <text class="s" x="506" y="542">.eml folders · Maildir</text>

  <!-- Cache -->
  <rect class="zone" x="740" y="456" width="240" height="120" rx="10"/>
  <text class="h" x="756" y="480">.cache/</text>
  <text class="m" x="756" y="504">catalog.db</text>
  <text class="m" x="756" y="524">cache_&lt;id&gt;.db</text>
  <text class="s" x="756" y="546">SQLite + FTS5, one per archive</text>
  <text class="s" x="756" y="566">rebuilt automatically if stale</text>

  <path class="arr" d="M370 576 V614" marker-end="url(#a)"/>
  <text class="s" x="380" y="600">read-only, in place</text>

  <!-- Archives -->
  <rect class="zone" x="20" y="616" width="700" height="56" rx="10"/>
  <text class="b" x="36" y="640">Your archives — never modified</text>
  <text class="s" x="36" y="660">archive-2003.pst · Thunderbird mbox · exported .eml folders · Maildir</text>
</svg>
