<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc">
  <title id="title">What lives in .cache/</title>
  <desc id="desc">catalog.db lists known archives and scanned folders. Each archive has its own cache_id.db with archive_meta, folders, messages, attachments, an FTS5 search table and the derived attachment_catalog.</desc>
  <style>
    svg { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
          --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --purple:#8250df; --red:#cf222e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --panel:#161b22; --line:#3d444d; --text:#e6edf3; --muted:#9198a1;
            --blue:#4493f8; --green:#3fb950; --amber:#d29922; --purple:#a371f7; --red:#f85149; }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .card { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .blue   { fill: var(--blue);   fill-opacity: .09; stroke: var(--blue);   stroke-width: 1.5; }
    .green  { fill: var(--green);  fill-opacity: .09; stroke: var(--green);  stroke-width: 1.5; }
    .amber  { fill: var(--amber);  fill-opacity: .10; stroke: var(--amber);  stroke-width: 1.5; }
    .purple { fill: var(--purple); fill-opacity: .09; stroke: var(--purple); stroke-width: 1.5; }
    .red    { fill: var(--red);    fill-opacity: .09; stroke: var(--red);    stroke-width: 1.5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); }
    .h  { font-size: 15px; font-weight: 700; }
    .b  { font-size: 14px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: var(--muted); }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .warn { fill: var(--red); }
    .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    .dash { stroke: var(--red); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .ah { fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="520" rx="14"/>

  <!-- catalog.db -->
  <rect class="purple" x="20" y="20" width="300" height="266" rx="10"/>
  <text class="mb" x="36" y="46">catalog.db</text>
  <text class="s" x="36" y="66">one per cache folder · the Archives menu</text>

  <rect class="card" x="36" y="80" width="268" height="128" rx="8"/>
  <text class="mb" x="50" y="102">known_archives</text>
  <text class="m" x="50" y="124">id  (sha256 of path)</text>
  <text class="m" x="50" y="142">name · file_path · format_type</text>
  <text class="m" x="50" y="160">file_size_bytes</text>
  <text class="m" x="50" y="178">total_messages · total_folders</text>
  <text class="m" x="50" y="196">last_opened_iso · last_scanned</text>

  <rect class="card" x="36" y="218" width="268" height="54" rx="8"/>
  <text class="mb" x="50" y="240">scan_directories</text>
  <text class="m" x="50" y="260">path · recursive</text>

  <rect class="zone" x="20" y="310" width="300" height="114" rx="10"/>
  <text class="b" x="36" y="336">Caches are disposable</text>
  <text class="s" x="36" y="358">Delete .cache/ and everything rebuilds</text>
  <text class="s" x="36" y="378">the next time an archive is opened.</text>
  <text class="s" x="36" y="398">Archives themselves are never written to.</text>

  <!-- cache_<id>.db -->
  <rect class="green" x="340" y="20" width="640" height="440" rx="10"/>
  <text class="mb" x="356" y="46">cache_&lt;id&gt;.db</text>
  <text class="s" x="356" y="66">one per archive · SQLite in WAL mode</text>

  <rect class="card" x="356" y="80" width="194" height="150" rx="8"/>
  <text class="mb" x="370" y="102">archive_meta</text>
  <text class="m" x="370" y="124">pst_path · pst_size</text>
  <text class="m" x="370" y="142">pst_mtime</text>
  <text class="m" x="370" y="160">format · format_type</text>
  <text class="m" x="370" y="178">driver_index_version</text>
  <text class="m" x="370" y="196">indexed_at</text>
  <text class="m" x="370" y="214">attachment_catalog_*</text>

  <rect class="card" x="570" y="80" width="186" height="114" rx="8"/>
  <text class="mb" x="584" y="102">folders</text>
  <text class="m" x="584" y="124">id · parent_id</text>
  <text class="m" x="584" y="142">name · full_path</text>
  <text class="m" x="584" y="160">depth</text>
  <text class="m" x="584" y="178">message_count</text>

  <path class="arr" d="M756 136 H774" marker-end="url(#a)"/>
  <text class="s" x="752" y="128">1:n</text>

  <rect class="card" x="776" y="80" width="190" height="168" rx="8"/>
  <text class="mb" x="790" y="102">messages</text>
  <text class="m" x="790" y="124">id · folder_id</text>
  <text class="m" x="790" y="142">folder_path</text>
  <text class="m" x="790" y="160">message_index</text>
  <text class="m" x="790" y="178">subject · sender_*</text>
  <text class="m" x="790" y="196">recipients_json</text>
  <text class="m" x="790" y="214">date_iso</text>
  <text class="m" x="790" y="232">body_preview</text>

  <path class="arr" d="M871 248 V286" marker-end="url(#a)"/>
  <text class="s" x="879" y="272">1:n</text>

  <rect class="card" x="776" y="288" width="190" height="114" rx="8"/>
  <text class="mb" x="790" y="310">attachments</text>
  <text class="m" x="790" y="332">id · message_id</text>
  <text class="m" x="790" y="350">attachment_index</text>
  <text class="m" x="790" y="368">filename · size</text>
  <text class="m" x="790" y="386">mime_type</text>

  <path class="arr" d="M776 345 H758" marker-end="url(#a)"/>
  <text class="s" x="754" y="337">1:1</text>

  <rect class="card" x="570" y="288" width="186" height="156" rx="8"/>
  <text class="mb" x="584" y="310">attachment_catalog</text>
  <text class="m" x="584" y="332">attachment_id</text>
  <text class="m" x="584" y="350">ext · category</text>
  <text class="m" x="584" y="368">dup_group · copies</text>
  <text class="m" x="584" y="386">is_noise</text>
  <text class="m" x="584" y="404">noise_reason</text>
  <text class="s" x="584" y="430">derived — see Spec 09</text>

  <rect class="card" x="356" y="288" width="194" height="114" rx="8"/>
  <text class="mb" x="370" y="310">messages_fts</text>
  <text class="s" x="370" y="332">FTS5 · porter, unicode61</text>
  <text class="m" x="370" y="352">subject · sender</text>
  <text class="m" x="370" y="370">recipients · body_plain</text>
  <text class="m" x="370" y="388">message_id → messages</text>

  <text class="s" x="500" y="496" text-anchor="middle">&lt;id&gt; = first 8 hex characters of sha256(absolute archive path), so each archive keeps its own isolated cache.</text>
</svg>
