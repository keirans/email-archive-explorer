<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Switching archives without interrupting requests</title>
  <desc id="desc">Requests hold a shared lock on archive A while archive B is indexed in the background. The swap takes an exclusive lock for milliseconds after in-flight requests finish; later requests use archive B, then A's driver is closed.</desc>
  <style>
    svg { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
          --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --purple:#8250df; --red:#cf222e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --panel:#161b22; --line:#3d444d; --text:#e6edf3; --muted:#9198a1;
            --blue:#4493f8; --green:#3fb950; --amber:#d29922; --purple:#a371f7; --red:#f85149; }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .card { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .blue   { fill: var(--blue);   fill-opacity: .09; stroke: var(--blue);   stroke-width: 1.5; }
    .green  { fill: var(--green);  fill-opacity: .09; stroke: var(--green);  stroke-width: 1.5; }
    .amber  { fill: var(--amber);  fill-opacity: .10; stroke: var(--amber);  stroke-width: 1.5; }
    .purple { fill: var(--purple); fill-opacity: .09; stroke: var(--purple); stroke-width: 1.5; }
    .red    { fill: var(--red);    fill-opacity: .09; stroke: var(--red);    stroke-width: 1.5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); }
    .h  { font-size: 15px; font-weight: 700; }
    .b  { font-size: 14px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: var(--muted); }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .warn { fill: var(--red); }
    .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    .dash { stroke: var(--red); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .ah { fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="330" rx="14"/>

  <text class="s" x="720" y="30" text-anchor="middle">swap: exclusive lock for milliseconds</text>
  <path class="dash" d="M720 38 V232"/>

  <!-- Lane 1: requests -->
  <text class="b" x="20" y="78">Requests</text>
  <text class="s" x="20" y="96">shared lock each</text>
  <rect class="blue" x="180" y="60" width="70" height="36" rx="6"/>
  <text class="m" x="215" y="83" text-anchor="middle">A</text>
  <rect class="blue" x="262" y="60" width="90" height="36" rx="6"/>
  <text class="m" x="307" y="83" text-anchor="middle">A</text>
  <rect class="blue" x="364" y="60" width="60" height="36" rx="6"/>
  <text class="m" x="394" y="83" text-anchor="middle">A</text>
  <rect class="blue" x="436" y="60" width="110" height="36" rx="6"/>
  <text class="m" x="491" y="83" text-anchor="middle">A</text>
  <rect class="blue" x="558" y="60" width="80" height="36" rx="6"/>
  <text class="m" x="598" y="83" text-anchor="middle">A</text>
  <rect class="blue" x="648" y="60" width="54" height="36" rx="6"/>
  <text class="m" x="675" y="83" text-anchor="middle">A</text>
  <rect class="card" x="712" y="104" width="36" height="22" rx="4" stroke-dasharray="3 3"/>
  <text class="s" x="754" y="120">queued until the swap ends</text>
  <rect class="green" x="750" y="60" width="72" height="36" rx="6"/>
  <text class="m" x="786" y="83" text-anchor="middle">B</text>
  <rect class="green" x="832" y="60" width="90" height="36" rx="6"/>
  <text class="m" x="877" y="83" text-anchor="middle">B</text>
  <rect class="green" x="932" y="60" width="48" height="36" rx="6"/>
  <text class="m" x="956" y="83" text-anchor="middle">B</text>

  <!-- Lane 2: open_archive -->
  <text class="b" x="20" y="188">open_archive(B)</text>
  <text class="s" x="20" y="206">one at a time</text>
  <rect class="zone" x="180" y="170" width="88" height="40" rx="6"/>
  <text class="s" x="224" y="195" text-anchor="middle">validate</text>
  <rect class="amber" x="274" y="170" width="420" height="40" rx="6"/>
  <text class="s" x="484" y="195" text-anchor="middle">build_index(B) if stale — A keeps serving</text>
  <rect class="red" x="704" y="170" width="32" height="40" rx="6"/>
  <rect class="zone" x="744" y="170" width="140" height="40" rx="6"/>
  <text class="s" x="814" y="195" text-anchor="middle">close driver A</text>

  <path class="arr" d="M180 244 H978" marker-end="url(#a)"/>
  <text class="s" x="978" y="262" text-anchor="end">time</text>

  <text class="s" x="20" y="290">• Every request pins the active archive (driver + cache path) for its whole lifetime, so a switch never closes a file mid-read.</text>
  <text class="s" x="20" y="312">• Indexing runs before the lock is taken, so a slow first open of a large archive doesn't block browsing the current one.</text>
</svg>
