<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Attachment Explorer data flow</title>
  <desc id="desc">Indexed attachments are classified, grouped into duplicates and filtered for noise into a derived attachment_catalog table, which feeds the attachment API and the Attachments view with discover lenses, facets, results and a detail pane showing the origin email.</desc>
  <style>
    svg { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
          --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --purple:#8250df; --red:#cf222e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --panel:#161b22; --line:#3d444d; --text:#e6edf3; --muted:#9198a1;
            --blue:#4493f8; --green:#3fb950; --amber:#d29922; --purple:#a371f7; --red:#f85149; }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .card { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .blue   { fill: var(--blue);   fill-opacity: .09; stroke: var(--blue);   stroke-width: 1.5; }
    .green  { fill: var(--green);  fill-opacity: .09; stroke: var(--green);  stroke-width: 1.5; }
    .amber  { fill: var(--amber);  fill-opacity: .10; stroke: var(--amber);  stroke-width: 1.5; }
    .purple { fill: var(--purple); fill-opacity: .09; stroke: var(--purple); stroke-width: 1.5; }
    .red    { fill: var(--red);    fill-opacity: .09; stroke: var(--red);    stroke-width: 1.5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); }
    .h  { font-size: 15px; font-weight: 700; }
    .b  { font-size: 14px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: var(--muted); }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .warn { fill: var(--red); }
    .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    .dash { stroke: var(--red); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .ah { fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="450" rx="14"/>

  <!-- Left: pipeline -->
  <rect class="zone" x="20" y="24" width="260" height="58" rx="10"/>
  <text class="b" x="36" y="48">attachments (index)</text>
  <text class="s" x="36" y="68">filename · size · MIME type</text>
  <path class="arr" d="M150 82 V102" marker-end="url(#a)"/>

  <rect class="blue" x="20" y="104" width="260" height="78" rx="10"/>
  <text class="b" x="36" y="128">Classify</text>
  <text class="s" x="36" y="148">extension → 12 categories</text>
  <text class="s" x="36" y="168">MIME fallback · preview kind</text>
  <path class="arr" d="M150 182 V202" marker-end="url(#a)"/>

  <rect class="blue" x="20" y="204" width="260" height="66" rx="10"/>
  <text class="b" x="36" y="228">Group duplicates</text>
  <text class="s" x="36" y="250">same name (any case) + size</text>
  <path class="arr" d="M150 270 V290" marker-end="url(#a)"/>

  <rect class="amber" x="20" y="292" width="260" height="136" rx="10"/>
  <text class="b" x="36" y="316">Noise rules (hidden by default)</text>
  <text class="m" x="36" y="340">small-image<tspan x="168">&lt; 10 KB</tspan></text>
  <text class="m" x="36" y="358">repeated-image<tspan x="168">≥ 5 copies</tspan></text>
  <text class="m" x="36" y="376">outlook-artifact<tspan x="168">winmail.dat …</tspan></text>
  <text class="m" x="36" y="394">mail-footer<tspan x="168">disclaimers</tspan></text>
  <text class="m" x="36" y="412">embedded-item<tspan x="168">Outlook items</tspan></text>

  <path class="arr" d="M280 226 H318" marker-end="url(#a)"/>

  <!-- Middle -->
  <rect class="zone" x="320" y="24" width="300" height="104" rx="10"/>
  <text class="b" x="336" y="48">Query</text>
  <text class="s" x="336" y="70">q · category · ext · year · sender</text>
  <text class="s" x="336" y="90">folder (incl. sub-folders) · size</text>
  <text class="s" x="336" y="110">hide_noise · collapse · sort</text>
  <path class="arr" d="M470 128 V184" marker-end="url(#a)"/>

  <rect class="green" x="320" y="186" width="300" height="80" rx="10"/>
  <text class="mb" x="336" y="212">attachment_catalog</text>
  <text class="s" x="336" y="234">derived table in cache_&lt;id&gt;.db</text>
  <text class="s" x="336" y="254">rebuilt automatically when stale</text>
  <path class="arr" d="M470 266 V290" marker-end="url(#a)"/>

  <rect class="purple" x="320" y="292" width="300" height="136" rx="10"/>
  <text class="b" x="336" y="316">Attachment API</text>
  <text class="m" x="336" y="340">GET  /api/attachments</text>
  <text class="m" x="336" y="358">GET  /api/attachments/summary</text>
  <text class="m" x="336" y="376">GET  /api/attachments/{id}</text>
  <text class="m" x="336" y="394">GET  …/{id}/contents[/{n}]</text>
  <text class="m" x="336" y="412">POST /api/attachments/zip</text>

  <path class="arr" d="M620 360 H668" marker-end="url(#a)"/>
  <text class="s" x="628" y="352">JSON</text>

  <!-- Right: UI -->
  <rect class="blue" x="670" y="24" width="310" height="404" rx="10"/>
  <text class="h" x="686" y="50">Attachments view</text>

  <rect class="card" x="686" y="64" width="278" height="50" rx="8"/>
  <text class="b" x="700" y="86">Discover lenses</text>
  <text class="s" x="700" y="104">Largest · Rare · Most forwarded · Photos</text>

  <rect class="card" x="686" y="124" width="80" height="180" rx="8"/>
  <text class="b" x="698" y="146">Facets</text>
  <text class="s" x="698" y="168">category</text>
  <text class="s" x="698" y="186">year</text>
  <text class="s" x="698" y="204">size</text>
  <text class="s" x="698" y="222">sender</text>
  <text class="s" x="698" y="240">rare types</text>

  <rect class="card" x="774" y="124" width="88" height="180" rx="8"/>
  <text class="b" x="786" y="146">Results</text>
  <text class="s" x="786" y="168">list or grid</text>
  <text class="s" x="786" y="186">×N copies</text>
  <text class="s" x="786" y="204">tick → ZIP</text>

  <rect class="card" x="870" y="124" width="94" height="180" rx="8"/>
  <text class="b" x="882" y="146">Detail</text>
  <text class="s" x="882" y="168">preview</text>
  <text class="s" x="882" y="186">inside ZIP</text>
  <text class="s" x="882" y="204">origin email</text>
  <text class="s" x="882" y="222">copies</text>
  <text class="s" x="882" y="240">first seen</text>

  <rect class="card" x="686" y="316" width="278" height="64" rx="8"/>
  <text class="b" x="700" y="340">Open email (o)</text>
  <text class="s" x="700" y="360">Mail view · right folder, page, message</text>

  <text class="m" x="686" y="410">j k · space · o · d · x · /</text>
</svg>
